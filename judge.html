<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judge Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <!-- Judge View -->
    <div id="judge-view" class="flex flex-col h-screen">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <i class="ph ph-scales text-2xl text-indigo-600"></i>
                <h1 class="text-xl font-bold text-slate-800">Judge Panel</h1>
            </div>
            <button onclick="switchRole()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Exit</button>
        </header>

        <main class="flex-1 overflow-hidden p-6 relative">
            
            <!-- Waiting State -->
            <div id="judge-waiting" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-10">
                <div class="relative flex items-center justify-center mb-6">
                    <div class="absolute w-24 h-24 border-4 border-indigo-200 rounded-full animate-ping opacity-75"></div>
                    <div class="relative bg-indigo-100 text-indigo-600 p-6 rounded-full">
                        <i class="ph ph-hourglass-high text-4xl animate-pulse"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-semibold text-slate-800 mb-2">Waiting for Candidate</h2>
                <p class="text-slate-500">The stage manager will push the next candidate to the stage shortly.</p>
            </div>

            <!-- Active State Layout -->
            <div id="judge-active" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
                <!-- Left: Profile & Scoring -->
                <div class="lg:col-span-8 flex flex-col bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex items-center gap-6 bg-gradient-to-br from-indigo-50 to-white">
                        <img id="judge-cand-img" src="" alt="Candidate" class="w-28 h-28 object-cover rounded-xl shadow-sm border-2 border-white bg-slate-100">
                        <div>
                            <span id="judge-theme-badge" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold uppercase tracking-wider rounded-full mb-2"></span>
                            <h2 id="judge-cand-name" class="text-3xl font-bold text-slate-900"></h2>
                            <p class="text-slate-500 mt-1 flex items-center gap-1"><i class="ph ph-hash"></i> Candidate <span id="judge-cand-id"></span></p>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-6">
                        <form id="scoring-form" onsubmit="submitScores(event)" class="max-w-2xl mx-auto space-y-8">
                            <!-- Sliders -->
                            <div class="space-y-6">
                                <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                    <div class="flex justify-between items-end mb-4">
                                        <label class="font-semibold text-slate-800 flex flex-col">
                                            <span>Poise & Bearing</span>
                                            <span class="text-xs text-slate-500 font-normal">Confidence, posture, and grace.</span>
                                        </label>
                                        <span class="text-2xl font-bold text-indigo-600" id="val-poise">5</span>
                                    </div>
                                    <input type="range" id="score-poise" min="1" max="10" value="5" oninput="updateSliderVal('poise')" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                                    <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium"><span>1 (Poor)</span><span>10 (Excellent)</span></div>
                                </div>

                                <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                    <div class="flex justify-between items-end mb-4">
                                        <label class="font-semibold text-slate-800 flex flex-col">
                                            <span>Stage Presence</span>
                                            <span class="text-xs text-slate-500 font-normal">Charisma, engagement, and energy.</span>
                                        </label>
                                        <span class="text-2xl font-bold text-indigo-600" id="val-presence">5</span>
                                    </div>
                                    <input type="range" id="score-presence" min="1" max="10" value="5" oninput="updateSliderVal('presence')" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                                    <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium"><span>1 (Poor)</span><span>10 (Excellent)</span></div>
                                </div>

                                <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                    <div class="flex justify-between items-end mb-4">
                                        <label class="font-semibold text-slate-800 flex flex-col">
                                            <span>Q&A / Intelligence</span>
                                            <span class="text-xs text-slate-500 font-normal">Articulation, relevance, and wit.</span>
                                        </label>
                                        <span class="text-2xl font-bold text-indigo-600" id="val-qa">5</span>
                                    </div>
                                    <input type="range" id="score-qa" min="1" max="10" value="5" oninput="updateSliderVal('qa')" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                                    <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium"><span>1 (Poor)</span><span>10 (Excellent)</span></div>
                                </div>
                            </div>

                            <!-- Remarks -->
                            <div>
                                <label class="block font-semibold text-slate-800 mb-2">Judge's Remarks (Optional)</label>
                                <textarea id="score-remarks" rows="3" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none resize-none text-sm" placeholder="Add specific comments about the performance..."></textarea>
                            </div>

                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-colors shadow-sm text-lg flex justify-center items-center gap-2">
                                <i class="ph ph-check-circle text-2xl"></i> Submit Official Scores
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right: Live Leaderboard (Mirrored from Admin) -->
                <div class="lg:col-span-4 flex flex-col bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 border-b border-slate-100 bg-gradient-to-r from-indigo-50 to-purple-50">
                        <h2 class="font-semibold text-indigo-900 flex items-center gap-2">
                            <i class="ph ph-ranking text-indigo-600"></i> Live Rankings
                        </h2>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-3" id="judge-leaderboard">
                        <!-- Leaderboard Injected via JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/leaderboard.js"></script>
    <script src="./js/judge.js"></script>
</body>
</html>
